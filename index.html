<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RETRIVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overscroll-behavior-y: none; /* Prevents pull-to-refresh / bounce on mobile when modals are open */
      }
      /* Brand Sync Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #0F766E;
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #0F766E;
      }

      /* Notification Specific Scrollbar - Thin & Teal */
      .notification-scrollbar::-webkit-scrollbar {
        width: 3px;
      }
      .notification-scrollbar::-webkit-scrollbar-thumb {
        background: #0F766E;
        border-radius: 10px;
      }
      .notification-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body class="bg-[#FDF9F4] dark:bg-[#1B1817] text-slate-900 dark:text-[#F5F1EA] transition-colors duration-300 antialiased selection:bg-[#E4D5C7] selection:text-[#33261D] dark:selection:bg-[#F97316]/30 dark:selection:text-[#F5F1EA]">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
